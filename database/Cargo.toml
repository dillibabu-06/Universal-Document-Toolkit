[package]
name = "database"
version = "0.1.0"
edition = "2021"

[dependencies]
sdw_core = { path = "../core" }
rusqlite = { version = "0.29", features = ["bundled", "modern_sqlite"] }
r2d2 = "0.8"
r2d2_sqlite = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.4", features = ["v4", "fast-rng"] }
chrono = "0.4"
refinery = { version = "0.8", features = ["rusqlite"] }
tracing = "0.1.44"
