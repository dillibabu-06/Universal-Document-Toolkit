[package]
name = "indexing"
version = "0.1.0"
edition = "2021"

[dependencies]
sdw_core = { path = "../core" }
database = { path = "../database" }
walkdir = "2.3"
sha2 = "0.10"
tokio = { version = "1.28", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.4", features = ["v4"] }
chrono = "0.4"
tracing = "0.1.44"
intelligence = { path = "../intelligence" }

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "scanner_bench"
harness = false
