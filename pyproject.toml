[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-document-toolkit"
version = "0.1.0"
description = "A local-first document productivity platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "PyMuPDF>=1.24.1",
    "pdfplumber>=0.11.0",
    "Pillow>=10.3.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "python-docx>=1.1.0",
    "docxtpl>=0.17.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "watchdog>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "platformdirs>=4.2.0",
    "pyinstaller>=6.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
